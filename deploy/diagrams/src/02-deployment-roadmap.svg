<svg xmlns="http://www.w3.org/2000/svg" fill="#0F172A" width="1600" height="940" viewBox="0 0 1600 940">
  <defs>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#64748B"/></marker>
    <style>
      text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Menlo, "SF Mono", Consolas, monospace; white-space: pre; }
      .muted { fill: #475569; }
      .num { font-size: 40px; font-weight: 800; }
    </style>
  </defs>
  <rect width="1600" height="940" fill="#F8FAFC"/>
  <text x="800" y="55" text-anchor="middle" font-size="32" font-weight="700">Deployment roadmap: 8 phases, in order</text>
  <text x="800" y="90" text-anchor="middle" font-size="18" class="muted">Do not skip ahead: each phase needs the one before it.</text>

  <!-- Row 1 -->
  <rect x="40" y="130" width="350" height="330" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="65" y="185" class="num" fill="#64748B">1</text>
  <text x="110" y="180" font-size="21" font-weight="700">Prepare accounts</text>
  <text x="65" y="225" font-size="15">&#8226; GCP project + billing</text>
  <text x="65" y="253" font-size="15">&#8226; A domain you control</text>
  <text x="65" y="281" font-size="15">&#8226; Dograh team + agent</text>
  <text x="65" y="309" font-size="15">&#8226; Twilio number in Dograh</text>
  <text x="65" y="337" font-size="15">&#8226; Google Cloud OAuth client</text>
  <text x="80" y="361" font-size="13" class="muted">(for the Sheets credential)</text>
  <text x="65" y="389" font-size="15">&#8226; Google Sheet with 3 tabs</text>
  <text x="65" y="435" font-size="13" class="muted">Who owns them? Decide now.</text>

  <rect x="425" y="130" width="350" height="330" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="450" y="185" class="num" fill="#64748B">2</text>
  <text x="495" y="180" font-size="21" font-weight="700">Create the server</text>
  <text x="450" y="225" font-size="15">&#8226; VM e2-medium, 30 GB disk</text>
  <text x="450" y="253" font-size="15">&#8226; Reserve a STATIC IP</text>
  <text x="450" y="281" font-size="15">&#8226; Firewall: 80, 443, 22 (your IP)</text>
  <text x="450" y="309" font-size="15">&#8226; DNS A record:</text>
  <text x="470" y="333" font-size="14" class="mono">n8n.client.com -&gt; IP</text>
  <text x="450" y="361" font-size="15">&#8226; SSH in with a key</text>
  <text x="450" y="435" font-size="13" class="muted">Check: ping n8n.client.com shows IP</text>

  <rect x="810" y="130" width="350" height="330" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="835" y="185" class="num" fill="#64748B">3</text>
  <text x="880" y="180" font-size="21" font-weight="700">Install the stack</text>
  <text x="835" y="225" font-size="15">&#8226; Copy deploy/ to the server</text>
  <text x="835" y="253" font-size="15">&#8226; scripts/install-docker.sh</text>
  <text x="835" y="281" font-size="15">&#8226; cp .env.example .env, fill it</text>
  <text x="850" y="305" font-size="13" class="muted">openssl rand -hex 32 for secrets</text>
  <text x="835" y="333" font-size="15">&#8226; docker compose up -d</text>
  <text x="835" y="361" font-size="15">&#8226; Open https://DOMAIN, create</text>
  <text x="850" y="385" font-size="15">the owner account</text>
  <text x="835" y="435" font-size="13" class="muted">Check: padlock + n8n login page</text>

  <rect x="1195" y="130" width="365" height="330" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1220" y="185" class="num" fill="#64748B">4</text>
  <text x="1265" y="180" font-size="21" font-weight="700">Move the workflow</text>
  <text x="1220" y="225" font-size="15">&#8226; Set Sheet ID + Dograh agent</text>
  <text x="1235" y="249" font-size="15">URL in Voice-Agent.json</text>
  <text x="1220" y="277" font-size="15">&#8226; scripts/import.sh</text>
  <text x="1220" y="305" font-size="15">&#8226; Create 3 credentials:</text>
  <text x="1235" y="329" font-size="14">Google Sheets (OAuth2)</text>
  <text x="1235" y="351" font-size="14">Dograh API key (Header Auth)</text>
  <text x="1235" y="373" font-size="14">Webhook secret (Header Auth)</text>
  <text x="1220" y="401" font-size="15">&#8226; Attach each to its nodes</text>
  <text x="1220" y="435" font-size="13" class="muted">Check: no red credential warnings</text>

  <!-- Row 2 -->
  <rect x="40" y="500" width="350" height="330" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="65" y="555" class="num" fill="#7C3AED">5</text>
  <text x="110" y="550" font-size="21" font-weight="700">Connect Dograh</text>
  <text x="65" y="595" font-size="15">&#8226; Webhook URL:</text>
  <text x="80" y="619" font-size="13" class="mono">https://DOMAIN/webhook/</text>
  <text x="80" y="639" font-size="13" class="mono">  dograh-call-completed</text>
  <text x="65" y="667" font-size="15">&#8226; Attach bearer credential</text>
  <text x="80" y="691" font-size="13" class="muted">(same secret as n8n)</text>
  <text x="65" y="719" font-size="15">&#8226; Copy API Trigger URL into</text>
  <text x="80" y="743" font-size="15">the n8n HTTP Request node</text>
  <text x="65" y="771" font-size="15" font-weight="700">&#8226; PUBLISH the agent</text>
  <text x="65" y="805" font-size="13" class="muted">Check: version is not "Draft"</text>

  <rect x="425" y="500" width="350" height="330" rx="16" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="450" y="555" class="num" fill="#059669">6</text>
  <text x="495" y="550" font-size="21" font-weight="700">Test end to end</text>
  <text x="450" y="595" font-size="15">&#8226; Activate the workflow</text>
  <text x="450" y="623" font-size="15">&#8226; Add 1 test row (your number,</text>
  <text x="465" y="647" font-size="15">Yes, Pending, past time)</text>
  <text x="450" y="675" font-size="15">&#8226; Phone rings within 1 min</text>
  <text x="450" y="703" font-size="15">&#8226; Queue row -&gt; Initiated</text>
  <text x="450" y="731" font-size="15">&#8226; Call_Attempts row added</text>
  <text x="450" y="759" font-size="15">&#8226; Feedback row after hang-up</text>
  <text x="450" y="805" font-size="13" class="muted">Check: webhook execution is green</text>

  <rect x="810" y="500" width="350" height="330" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="835" y="555" class="num" fill="#64748B">7</text>
  <text x="880" y="550" font-size="21" font-weight="700">Operate it</text>
  <text x="835" y="595" font-size="15">&#8226; Nightly backup cron (+ GCS)</text>
  <text x="835" y="623" font-size="15">&#8226; Save .env in password manager</text>
  <text x="835" y="651" font-size="15">&#8226; HTTPS uptime check + alerts</text>
  <text x="835" y="679" font-size="15">&#8226; Ops Agent + dashboard</text>
  <text x="835" y="707" font-size="15">&#8226; n8n Error Workflow (email/Slack)</text>
  <text x="835" y="735" font-size="15">&#8226; Upgrade n8n on purpose:</text>
  <text x="850" y="759" font-size="13" class="muted">backup, change N8N_VERSION, up -d</text>
  <text x="835" y="805" font-size="13" class="muted">Check: test a restore once</text>

  <rect x="1195" y="500" width="365" height="330" rx="16" fill="#0F172A"/>
  <text x="1220" y="555" class="num" fill="#94A3B8">8</text>
  <text x="1265" y="550" font-size="21" font-weight="700" fill="#F8FAFC">Hand over</text>
  <text x="1220" y="595" font-size="15" fill="#E2E8F0">&#8226; Client owns: GCP, domain,</text>
  <text x="1235" y="619" font-size="15" fill="#E2E8F0">Dograh, Twilio, Google Sheet</text>
  <text x="1220" y="647" font-size="15" fill="#E2E8F0">&#8226; Give: URL, owner login,</text>
  <text x="1235" y="671" font-size="15" fill="#E2E8F0">this README, a short runbook</text>
  <text x="1220" y="699" font-size="15" fill="#E2E8F0">&#8226; Never hand over YOUR keys</text>
  <text x="1235" y="723" font-size="15" fill="#E2E8F0">or your encryption key</text>
  <text x="1220" y="751" font-size="15" fill="#E2E8F0">&#8226; Agree support + updates</text>
  <text x="1220" y="805" font-size="13" fill="#94A3B8">Check: client can log in alone</text>

  <line x1="392" y1="295" x2="421" y2="295" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="777" y1="295" x2="806" y2="295" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1162" y1="295" x2="1191" y2="295" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1377,462 L1377,480 L215,480 L215,496" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="392" y1="665" x2="421" y2="665" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="777" y1="665" x2="806" y2="665" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1162" y1="665" x2="1191" y2="665" stroke="#64748B" stroke-width="3" marker-end="url(#a)"/>

  <text x="800" y="890" text-anchor="middle" font-size="17" class="muted">Files for every phase are in the deploy/ folder: docker-compose.yml, .env.example, Caddyfile, scripts/, workflows/.</text>
</svg>
