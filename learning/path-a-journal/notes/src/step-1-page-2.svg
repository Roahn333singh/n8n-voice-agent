<svg xmlns="http://www.w3.org/2000/svg" fill="#1F2937" width="1500" height="2000" viewBox="0 0 1500 2000">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ruled" width="1500" height="44" patternUnits="userSpaceOnUse">
      <line x1="0" y1="43" x2="1500" y2="43" stroke="#D6E6F5" stroke-width="2"/>
    </pattern>
    <style>
      text { font-family: "Noteworthy", "Chalkboard SE", "Comic Sans MS", cursive; }
      .h { font-family: "Marker Felt", "Chalkboard SE", cursive; }
      .code { font-family: Menlo, monospace; white-space: pre; }
    </style>
  </defs>

  <rect width="1500" height="2000" fill="#FFFDF4"/>
  <rect y="150" width="1500" height="1850" fill="url(#ruled)"/>
  <line x1="115" y1="0" x2="115" y2="2000" stroke="#F4A3A3" stroke-width="3"/>

  <text x="150" y="92" class="h" font-size="60" fill="#1E3A8A">Step 1 (cont.): Grow the disk</text>
  <text x="150" y="138" font-size="26" fill="#64748B">10 GB  &#8594;  30 GB, while n8n kept running   |   page 2 of 2</text>

  <text x="150" y="225" class="h" font-size="42" fill="#B91C1C">3. A disk has 3 layers. Grow all 3, in order!</text>

  <!-- nested layers -->
  <rect x="150" y="265" width="660" height="420" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="4" filter="url(#rough)"/>
  <text x="175" y="305" class="h" font-size="28" fill="#1D4ED8">DISK  (Google Cloud)   10 &#8594; 30 GB</text>
  <rect x="190" y="330" width="580" height="330" rx="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="4" filter="url(#rough)"/>
  <text x="215" y="370" class="h" font-size="27" fill="#15803D">PARTITION  /dev/sda1   9.9 &#8594; 29.9 GB</text>
  <rect x="230" y="395" width="500" height="240" rx="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="4" filter="url(#rough)"/>
  <text x="255" y="440" class="h" font-size="27" fill="#C2410C">FILESYSTEM  ext4</text>
  <text x="255" y="484" font-size="25">where your files actually live</text>
  <text x="255" y="528" font-size="25">(n8n, Docker, logs...)</text>
  <text x="255" y="580" font-size="25">5.3 GB used</text>

  <text x="860" y="310" class="h" font-size="32" fill="#7C3AED">Think of land:</text>
  <text x="860" y="362" font-size="27">1. Buy more land  <tspan fill="#2563EB">(disk)</tspan></text>
  <text x="860" y="410" font-size="27">2. Move the fence  <tspan fill="#16A34A">(partition)</tspan></text>
  <text x="860" y="458" font-size="27">3. Use the new space  <tspan fill="#EA580C">(filesystem)</tspan></text>
  <text x="860" y="530" font-size="25">Skip a step = space you pay for</text>
  <text x="860" y="568" font-size="25">but cannot use. (After step a,</text>
  <text x="860" y="606" font-size="25">df -h still said 9.7 GB!)</text>

  <!-- step rows -->
  <circle cx="175" cy="750" r="24" fill="#2563EB"/><text x="175" y="759" text-anchor="middle" font-size="26" fill="#FFFFFF" font-weight="bold">a</text>
  <text x="215" y="760" font-size="27"><tspan font-weight="bold">Google side:</tspan> make the disk bigger</text>
  <rect x="150" y="785" width="1290" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="3" filter="url(#rough)"/>
  <text x="175" y="824" class="code" font-size="22">gcloud compute disks resize n8n-vm --size=30GB --zone=asia-south1-c</text>

  <circle cx="175" cy="900" r="24" fill="#64748B"/><text x="175" y="909" text-anchor="middle" font-size="26" fill="#FFFFFF" font-weight="bold">b</text>
  <text x="215" y="910" font-size="27"><tspan font-weight="bold">On the VM:</tspan> install the growpart tool (one time only)</text>
  <rect x="150" y="935" width="1290" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="3" filter="url(#rough)"/>
  <text x="175" y="974" class="code" font-size="22">sudo apt-get install -y cloud-guest-utils</text>

  <circle cx="175" cy="1050" r="24" fill="#16A34A"/><text x="175" y="1059" text-anchor="middle" font-size="26" fill="#FFFFFF" font-weight="bold">c</text>
  <text x="215" y="1060" font-size="27"><tspan font-weight="bold">Move the fence:</tspan> stretch partition number 1 to fill the disk</text>
  <rect x="150" y="1085" width="1290" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="3" filter="url(#rough)"/>
  <text x="175" y="1124" class="code" font-size="22">sudo growpart /dev/sda 1        <tspan font-family="Noteworthy" font-size="22" fill="#64748B">(space between sda and 1!)</tspan></text>

  <circle cx="175" cy="1200" r="24" fill="#EA580C"/><text x="175" y="1209" text-anchor="middle" font-size="26" fill="#FFFFFF" font-weight="bold">d</text>
  <text x="215" y="1210" font-size="27"><tspan font-weight="bold">Use the space:</tspan> stretch the filesystem to fill the partition</text>
  <rect x="150" y="1235" width="1290" height="60" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="3" filter="url(#rough)"/>
  <text x="175" y="1274" class="code" font-size="22">sudo resize2fs /dev/sda1        <tspan font-family="Noteworthy" font-size="22" fill="#64748B">(no space here)</tspan></text>

  <rect x="150" y="1325" width="1290" height="92" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3" filter="url(#rough)"/>
  <text x="180" y="1365" font-size="26">All done ONLINE: no reboot, n8n never stopped.</text>
  <text x="180" y="1401" font-size="26">Disks can only GROW, never shrink. That is why we took the snapshot first.</text>

  <!-- checks -->
  <text x="150" y="1490" class="h" font-size="38" fill="#047857">How I checked it worked</text>

  <text x="150" y="1540" class="code" font-size="21">lsblk /dev/sda</text>
  <text x="830" y="1540" font-size="25">&#8594; sda 30G, sda1 29.9G</text>
  <text x="150" y="1590" class="code" font-size="21">df -h /</text>
  <text x="830" y="1590" font-size="25">&#8594; 30G total, only 19% used</text>
  <text x="150" y="1640" class="code" font-size="21">sudo docker ps</text>
  <text x="830" y="1640" font-size="25">&#8594; n8n "Up 3 days" (never restarted)</text>
  <text x="150" y="1690" class="code" font-size="21">curl -s -o /dev/null -w "%{http_code}" \</text>
  <text x="150" y="1722" class="code" font-size="21">  https://n8n.example.com/healthz</text>
  <text x="830" y="1706" font-size="25">&#8594; 200 = n8n is alive</text>

  <text x="150" y="1800" class="h" font-size="34" fill="#1E3A8A">How I actually ran it</text>
  <text x="150" y="1846" font-size="25">Through the Google Cloud console's API (exactly what gcloud does underneath).</text>
  <text x="150" y="1888" font-size="25">To run gcloud yourself:   <tspan class="code" font-size="21">gcloud auth login</tspan>   (you@example.com)</text>
  <text x="150" y="1930" font-size="25">then:   <tspan class="code" font-size="21">gcloud config set project your-gcp-project-id</tspan></text>
</svg>
