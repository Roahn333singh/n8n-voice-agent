<svg xmlns="http://www.w3.org/2000/svg" fill="#1F2937" width="1500" height="2000" viewBox="0 0 1500 2000">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ruled" width="1500" height="44" patternUnits="userSpaceOnUse">
      <line x1="0" y1="43" x2="1500" y2="43" stroke="#D6E6F5" stroke-width="2"/>
    </pattern>
    <style>
      text { font-family: "Noteworthy", "Chalkboard SE", "Comic Sans MS", cursive; }
      .h { font-family: "Marker Felt", "Chalkboard SE", cursive; }
      .code { font-family: Menlo, monospace; white-space: pre; }
    </style>
  </defs>

  <rect width="1500" height="2000" fill="#FFFDF4"/>
  <rect y="150" width="1500" height="1850" fill="url(#ruled)"/>
  <line x1="115" y1="0" x2="115" y2="2000" stroke="#F4A3A3" stroke-width="3"/>

  <text x="150" y="92" class="h" font-size="58" fill="#1E3A8A">Step 5: Before, after, and plan B</text>
  <text x="150" y="138" font-size="26" fill="#64748B">so the demo works even when the phone line does not   |   page 2 of 2</text>

  <!-- A: before -->
  <text x="150" y="215" class="h" font-size="38" fill="#7C3AED">30 minutes before</text>
  <rect x="150" y="235" width="1290" height="110" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="170" y="272" font-size="20" fill="#64748B"># on your Mac: reset the sheet + check everything (takes ~20 s)</text>
  <text x="170" y="312" class="code" font-size="19">ssh -i ~/.ssh/id_ed25519 your-user@YOUR_SERVER_IP 'sudo /opt/voice-agent/scripts/demo-reset.sh'</text>
  <text x="150" y="385" font-size="22">Last line must say <tspan font-weight="bold" fill="#047857">READY FOR THE DEMO</tspan>. Any <tspan class="code" font-size="20">[!!]</tspan> line = fix it first (or call me).</text>
  <g font-size="22">
    <text x="150" y="430">&#9744; phone charged, ringer + volume up, Do Not Disturb OFF</text>
    <text x="150" y="468">&#9744; Mac: Focus mode ON (no pop-ups on screen), quiet room</text>
    <text x="150" y="506">&#9744; 4 tabs open: Sheet (Outreach_Queue), n8n Voice-Agent, n8n Executions, backup video</text>
    <text x="150" y="544">&#9744; logged in to n8n already (no password typing in front of the client)</text>
  </g>

  <!-- B: plan B -->
  <text x="150" y="625" class="h" font-size="38" fill="#B91C1C">Plan B: if something goes wrong live</text>
  <rect x="150" y="645" width="1290" height="60" fill="#FEE2E2"/>
  <text x="170" y="684" font-size="22" font-weight="bold">What happens</text>
  <text x="640" y="684" font-size="22" font-weight="bold">What you do</text>
  <g font-size="21">
    <text x="170" y="745">Phone does not ring after 90 s</text>
    <text x="640" y="745">Look at n8n Executions once. Then: "Let me show you one I recorded</text>
    <text x="640" y="777">this morning" and play the backup video.</text>
    <text x="170" y="837">Agent mishears / call is clumsy</text>
    <text x="640" y="837">Keep going: it is a real phone call. Mention it rephrases and moves on.</text>
    <text x="170" y="897">No Feedback row after 30 s</text>
    <text x="640" y="897">Refresh the Sheet. Then show the webhook run in n8n Executions.</text>
    <text x="170" y="957">Internet dies</text>
    <text x="640" y="957">Play the backup video (keep it on the Mac, not in the cloud).</text>
  </g>
  <g stroke="#FCA5A5" stroke-width="2">
    <line x1="150" y1="800" x2="1440" y2="800"/><line x1="150" y1="860" x2="1440" y2="860"/>
    <line x1="150" y1="920" x2="1440" y2="920"/><line x1="150" y1="980" x2="1440" y2="980"/>
  </g>
  <text x="150" y="1030" class="h" font-size="28" fill="#B91C1C">Golden rule: never debug for more than 1 minute in front of a client.</text>

  <!-- C: recording -->
  <text x="150" y="1115" class="h" font-size="38" fill="#7C3AED">Make the backup video (once, 10 minutes)</text>
  <rect x="150" y="1135" width="1290" height="330" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="3" filter="url(#rough)"/>
  <g font-size="22">
    <text x="175" y="1180">1. Run the demo reset. Arrange: Sheet on the left half, n8n on the right half.</text>
    <text x="175" y="1220">2. Press <tspan class="code" font-size="20">Cmd + Shift + 5</tspan> &gt; "Record Entire Screen" &gt; Options &gt; Microphone: MacBook mic.</text>
    <text x="175" y="1260">3. Phone on speaker, next to the Mac, so the call is recorded too.</text>
    <text x="175" y="1300">4. Click Record. Do scenes 4, 5, 6 (flip to Pending, the call, the results).</text>
    <text x="175" y="1340">5. Stop with the stop button in the menu bar. Save as <tspan class="code" font-size="20">voice-agent-demo-backup.mov</tspan></text>
    <text x="175" y="1380">6. Play it back once WITH sound. Then run the demo reset again.</text>
  </g>
  <text x="175" y="1430" font-size="21" fill="#1D4ED8">This rehearsal also checks the new rating question (no "ten being the highest").</text>

  <!-- D: after + client number -->
  <rect x="150" y="1505" width="620" height="330" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="3" filter="url(#rough)"/>
  <text x="175" y="1550" class="h" font-size="30" fill="#047857">After the demo</text>
  <text x="175" y="1595" font-size="22">Run the same reset command.</text>
  <text x="175" y="1633" font-size="22">The old rows are saved first in</text>
  <text x="175" y="1667" class="code" font-size="16">/var/backups/voice-agent/</text>
  <text x="175" y="1691" class="code" font-size="16">  demo-sheet-before-reset-*.json</text>
  <text x="175" y="1735" font-size="22">Only want to look, not change?</text>
  <text x="175" y="1773" font-size="22">add <tspan class="code" font-size="20">--check</tspan> at the end.</text>

  <rect x="820" y="1505" width="620" height="330" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="3" filter="url(#rough)"/>
  <text x="845" y="1550" class="h" font-size="30" fill="#92400E">Client wants the call?</text>
  <text x="845" y="1595" font-size="22">With their OK, put their name and</text>
  <text x="845" y="1633" font-size="22">number on DEMO-1002:</text>
  <text x="845" y="1671" font-size="22">customer_name + phone_e164</text>
  <text x="845" y="1709" font-size="22">(format <tspan class="code" font-size="20">+91XXXXXXXXXX</tspan>), then Pending.</text>
  <text x="845" y="1757" font-size="22">The reset afterwards puts your</text>
  <text x="845" y="1795" font-size="22">demo data back and removes theirs.</text>

  <text x="1440" y="1940" text-anchor="end" class="h" font-size="32" fill="#1E3A8A">journal: path-a-journal/README.md, Step 5</text>
</svg>
