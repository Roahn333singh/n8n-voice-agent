<svg xmlns="http://www.w3.org/2000/svg" fill="#0F172A" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#059669"/></marker>
    <marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#DC2626"/></marker>
    <style>
      text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Menlo, "SF Mono", Consolas, monospace; white-space: pre; }
      .muted { fill: #475569; }
      .light { fill: #E2E8F0; }
    </style>
  </defs>
  <rect width="1600" height="1060" fill="#F8FAFC"/>

  <text x="800" y="60" text-anchor="middle" font-size="34" font-weight="700">Anatomy of an authenticated webhook request</text>
  <text x="800" y="97" text-anchor="middle" font-size="19" class="muted">What actually travels over HTTPS, and how n8n decides whether to run the workflow</text>

  <!-- Request card -->
  <rect x="50" y="135" width="760" height="520" rx="16" fill="#0F172A"/>
  <text x="80" y="175" font-size="15" font-weight="700" fill="#94A3B8">HTTP REQUEST sent by Dograh</text>

  <text x="80" y="220" font-size="17" class="mono" fill="#FBBF24">POST /webhook/dograh-call-completed HTTP/1.1</text>
  <text x="80" y="252" font-size="17" class="mono light">Host: n8n.example.com</text>
  <text x="80" y="284" font-size="17" class="mono light">Content-Type: application/json</text>
  <text x="80" y="316" font-size="17" class="mono light">X-Dograh-Workflow-Run-Id: 734114</text>
  <rect x="68" y="332" width="724" height="40" rx="8" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="80" y="359" font-size="17" class="mono" fill="#6EE7B7" font-weight="700">Authorization: Bearer 9f3c&#8230;e71a</text>
  <text x="80" y="408" font-size="17" class="mono light">{</text>
  <text x="80" y="438" font-size="17" class="mono light">  "attempt_id": "734114",</text>
  <text x="80" y="468" font-size="17" class="mono light">  "nps": 7,</text>
  <text x="80" y="498" font-size="17" class="mono light">  "follow_up_requested": false,</text>
  <text x="80" y="528" font-size="17" class="mono light">  "exact_quote": "people compliment its smell",</text>
  <text x="80" y="558" font-size="17" class="mono light">  "summary": "Likes the scent, would buy again"</text>
  <text x="80" y="588" font-size="17" class="mono light">}</text>

  <!-- labels on the left card -->
  <text x="80" y="630" font-size="14" fill="#94A3B8">&#9312; method + path (which door)    &#9313; headers (metadata + the key)    &#9314; body (the data)</text>

  <!-- n8n check flow -->
  <text x="1170" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#BE123C">What n8n's webhook node does</text>

  <rect x="900" y="200" width="540" height="78" rx="12" fill="#FFF1F4" stroke="#EA4B71" stroke-width="2"/>
  <text x="1170" y="232" text-anchor="middle" font-size="17" font-weight="600">Is there a header named</text>
  <text x="1170" y="260" text-anchor="middle" font-size="17" class="mono">Authorization ?</text>

  <line x1="1170" y1="282" x2="1170" y2="318" stroke="#334155" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="900" y="322" width="540" height="100" rx="12" fill="#FFF1F4" stroke="#EA4B71" stroke-width="2"/>
  <text x="1170" y="354" text-anchor="middle" font-size="17" font-weight="600">Is its value EXACTLY equal to the credential?</text>
  <text x="1170" y="384" text-anchor="middle" font-size="16" class="mono">"Bearer 9f3c&#8230;e71a"</text>
  <text x="1170" y="408" text-anchor="middle" font-size="14" class="muted">same word, same space, same characters</text>

  <line x1="1060" y1="426" x2="990" y2="486" stroke="#059669" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="945" y="460" font-size="16" font-weight="700" fill="#059669">yes</text>
  <line x1="1280" y1="426" x2="1350" y2="486" stroke="#DC2626" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="1340" y="460" font-size="16" font-weight="700" fill="#DC2626">no / missing</text>

  <rect x="860" y="492" width="300" height="160" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="1010" y="527" text-anchor="middle" font-size="20" font-weight="700" fill="#047857">200 OK</text>
  <text x="1010" y="560" text-anchor="middle" font-size="15">Workflow runs.</text>
  <text x="1010" y="584" text-anchor="middle" font-size="15">Body available as</text>
  <text x="1010" y="608" text-anchor="middle" font-size="15" class="mono">$json.body.nps</text>
  <text x="1010" y="634" text-anchor="middle" font-size="14" class="muted">Execution is saved</text>

  <rect x="1180" y="492" width="300" height="160" rx="12" fill="#FEF2F2" stroke="#F87171" stroke-width="2"/>
  <text x="1330" y="527" text-anchor="middle" font-size="20" font-weight="700" fill="#B91C1C">403 Forbidden</text>
  <text x="1330" y="560" text-anchor="middle" font-size="15">Workflow does NOT run.</text>
  <text x="1330" y="584" text-anchor="middle" font-size="15">Nothing in Executions.</text>
  <text x="1330" y="610" text-anchor="middle" font-size="14" class="muted">Only visible in the sender's</text>
  <text x="1330" y="632" text-anchor="middle" font-size="14" class="muted">logs or the Caddy log</text>

  <!-- Bottom: same header, different input forms -->
  <text x="800" y="715" text-anchor="middle" font-size="24" font-weight="700">Same header on the wire, different boxes to type it into</text>

  <rect x="50" y="745" width="480" height="230" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="75" y="780" font-size="18" font-weight="700" fill="#6D28D9">Dograh &#183; credential type bearer_token</text>
  <text x="75" y="815" font-size="16">You type only the token:</text>
  <rect x="75" y="828" width="430" height="38" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/>
  <text x="90" y="853" font-size="16" class="mono">9f3c&#8230;e71a</text>
  <text x="75" y="900" font-size="16">Dograh adds the prefix for you and sends:</text>
  <text x="75" y="932" font-size="15" class="mono" fill="#6D28D9">Authorization: Bearer 9f3c&#8230;e71a</text>

  <rect x="560" y="745" width="480" height="230" rx="14" fill="#FFF1F4" stroke="#EA4B71" stroke-width="2"/>
  <text x="585" y="780" font-size="18" font-weight="700" fill="#BE123C">n8n &#183; Header Auth (webhook lock)</text>
  <text x="585" y="815" font-size="16">You type the header name AND full value:</text>
  <rect x="585" y="828" width="430" height="38" rx="8" fill="#FFFFFF" stroke="#FDA4AF"/>
  <text x="600" y="853" font-size="16" class="mono">Name:  Authorization</text>
  <rect x="585" y="874" width="430" height="38" rx="8" fill="#FFFFFF" stroke="#FDA4AF"/>
  <text x="600" y="899" font-size="16" class="mono">Value: Bearer 9f3c&#8230;e71a</text>
  <text x="585" y="945" font-size="15" class="muted">Forget "Bearer " (with the space) &#8594; 403</text>

  <rect x="1070" y="745" width="480" height="230" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="1095" y="780" font-size="18" font-weight="700" fill="#1D4ED8">n8n &#183; Header Auth (HTTP Request)</text>
  <text x="1095" y="815" font-size="16">Used for n8n &#8594; Dograh. Dograh wants:</text>
  <rect x="1095" y="828" width="430" height="38" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="1110" y="853" font-size="16" class="mono">Name:  X-API-Key</text>
  <rect x="1095" y="874" width="430" height="38" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="1110" y="899" font-size="16" class="mono">Value: dgr_xxxxxxxx</text>
  <text x="1095" y="945" font-size="15" class="muted">No "Bearer": each API documents its own header</text>

  <text x="800" y="1025" text-anchor="middle" font-size="17" class="muted">Header names are case-insensitive (authorization = Authorization). Values are compared exactly.</text>
</svg>
