<svg xmlns="http://www.w3.org/2000/svg" fill="#1F2937" width="1500" height="2000" viewBox="0 0 1500 2000">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ruled" width="1500" height="44" patternUnits="userSpaceOnUse">
      <line x1="0" y1="43" x2="1500" y2="43" stroke="#D6E6F5" stroke-width="2"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: "Noteworthy", "Chalkboard SE", "Comic Sans MS", cursive; }
      .h { font-family: "Marker Felt", "Chalkboard SE", cursive; }
      .code, .code text, .code tspan { font-family: Menlo, monospace; white-space: pre; }
    </style>
  </defs>

  <rect width="1500" height="2000" fill="#FFFDF4"/>
  <rect y="150" width="1500" height="1850" fill="url(#ruled)"/>
  <line x1="115" y1="0" x2="115" y2="2000" stroke="#F4A3A3" stroke-width="3"/>

  <text x="150" y="92" class="h" font-size="58" fill="#1E3A8A">How the explainer video is made</text>
  <text x="150" y="138" font-size="26" fill="#64748B">90 seconds  |  written as code, rendered to MP4  |  folder marketing/explainer-video</text>

  <!-- 1. pipeline -->
  <text x="150" y="205" class="h" font-size="34" fill="#B45309">1. From a real call to a video</text>

  <g filter="url(#rough)" stroke-width="3">
    <rect x="150" y="235" width="370" height="120" rx="16" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="600" y="235" width="370" height="120" rx="16" fill="#F1F5F9" stroke="#64748B"/>
    <rect x="1050" y="235" width="380" height="120" rx="16" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="1050" y="445" width="380" height="140" rx="16" fill="#DCFCE7" stroke="#16A34A"/>
    <rect x="600" y="445" width="370" height="140" rx="16" fill="#F5F3FF" stroke="#7C3AED"/>
    <rect x="150" y="445" width="370" height="140" rx="16" fill="#FEE2E2" stroke="#DC2626"/>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arr)">
    <line x1="525" y1="295" x2="592" y2="295"/>
    <line x1="975" y1="295" x2="1042" y2="295"/>
    <line x1="1240" y1="360" x2="1240" y2="437"/>
    <line x1="1045" y1="515" x2="978" y2="515"/>
    <line x1="595" y1="515" x2="528" y2="515"/>
  </g>
  <text x="335" y="285" class="h" font-size="28" text-anchor="middle">Real call</text>
  <text x="335" y="322" font-size="21" text-anchor="middle">Dograh keeps every recording</text>
  <text x="785" y="285" class="code" font-size="22" text-anchor="middle">raw/mix.wav</text>
  <text x="785" y="322" font-size="21" text-anchor="middle">the full 2-minute call</text>
  <text x="1240" y="285" class="code" font-size="22" text-anchor="middle">build_audio.py</text>
  <text x="1240" y="322" font-size="21" text-anchor="middle">cuts 11 lines, cleans them</text>
  <text x="1240" y="485" class="code" font-size="20" text-anchor="middle">call.wav  music.wav</text>
  <text x="1240" y="520" class="code" font-size="20" text-anchor="middle">captions.ts</text>
  <text x="1240" y="557" font-size="20" text-anchor="middle">36 s of call + caption times</text>
  <text x="785" y="485" class="h" font-size="28" text-anchor="middle">6 scenes in React</text>
  <text x="785" y="522" class="code" font-size="20" text-anchor="middle">src/scenes/*.tsx</text>
  <text x="785" y="557" font-size="20" text-anchor="middle">written by Opus 5.5</text>
  <text x="335" y="485" class="h" font-size="28" text-anchor="middle">MP4 + thumbnail</text>
  <text x="335" y="522" class="code" font-size="20" text-anchor="middle">out/aurelia-...mp4</text>
  <text x="335" y="557" font-size="20" text-anchor="middle">1080p, 90 s, 7.5 MB</text>
  <text x="558" y="274" font-size="19" fill="#475569" text-anchor="middle">download</text>
  <text x="1010" y="274" font-size="19" fill="#475569" text-anchor="middle">cut</text>
  <text x="1010" y="500" font-size="19" fill="#475569" text-anchor="middle">feeds</text>
  <text x="560" y="500" font-size="19" fill="#475569" text-anchor="middle">render</text>

  <!-- 2. frames -->
  <text x="150" y="655" class="h" font-size="34" fill="#B45309">2. A video is just 2700 pictures</text>
  <g filter="url(#rough)">
    <rect x="150" y="680" width="640" height="130" rx="8" fill="#334155"/>
    <g fill="#FFFDF4">
      <rect x="165" y="690" width="22" height="14" rx="3"/><rect x="225" y="690" width="22" height="14" rx="3"/>
      <rect x="285" y="690" width="22" height="14" rx="3"/><rect x="345" y="690" width="22" height="14" rx="3"/>
      <rect x="405" y="690" width="22" height="14" rx="3"/><rect x="465" y="690" width="22" height="14" rx="3"/>
      <rect x="525" y="690" width="22" height="14" rx="3"/><rect x="585" y="690" width="22" height="14" rx="3"/>
      <rect x="645" y="690" width="22" height="14" rx="3"/><rect x="705" y="690" width="22" height="14" rx="3"/>
      <rect x="165" y="786" width="22" height="14" rx="3"/><rect x="225" y="786" width="22" height="14" rx="3"/>
      <rect x="285" y="786" width="22" height="14" rx="3"/><rect x="345" y="786" width="22" height="14" rx="3"/>
      <rect x="405" y="786" width="22" height="14" rx="3"/><rect x="465" y="786" width="22" height="14" rx="3"/>
      <rect x="525" y="786" width="22" height="14" rx="3"/><rect x="585" y="786" width="22" height="14" rx="3"/>
      <rect x="645" y="786" width="22" height="14" rx="3"/><rect x="705" y="786" width="22" height="14" rx="3"/>
    </g>
    <rect x="170" y="714" width="180" height="62" rx="4" fill="#FBF8F2"/>
    <rect x="370" y="714" width="180" height="62" rx="4" fill="#FBF8F2"/>
    <rect x="570" y="714" width="180" height="62" rx="4" fill="#FBF8F2"/>
  </g>
  <text x="260" y="754" font-size="22" text-anchor="middle">frame 1</text>
  <text x="460" y="754" font-size="22" text-anchor="middle">frame 2</text>
  <text x="660" y="754" font-size="22" text-anchor="middle">frame 3 ...</text>
  <text x="830" y="712" font-size="23">30 pictures per second x 90 s = <tspan font-weight="bold">2700 frames</tspan>.</text>
  <text x="830" y="752" font-size="23">Chrome draws each frame like a web page,</text>
  <text x="830" y="792" font-size="23">ffmpeg glues them together and adds sound.</text>

  <!-- 3. timeline -->
  <text x="150" y="875" class="h" font-size="34" fill="#B45309">3. The 6 scenes (seconds)</text>
  <g filter="url(#rough)" stroke="#475569" stroke-width="2">
    <rect x="150" y="900" width="100" height="60" fill="#DBEAFE"/>
    <rect x="250" y="900" width="129" height="60" fill="#FEE2E2"/>
    <rect x="379" y="900" width="172" height="60" fill="#FEF3C7"/>
    <rect x="551" y="900" width="573" height="60" fill="#F5F3FF"/>
    <rect x="1124" y="900" width="158" height="60" fill="#DCFCE7"/>
    <rect x="1282" y="900" width="158" height="60" fill="#EDE9FE"/>
  </g>
  <g font-size="22" text-anchor="middle">
    <text x="200" y="938">Hook</text><text x="314" y="938">Problem</text><text x="465" y="938">How it works</text>
    <text x="837" y="938">The real call: phone, captions, live notes</text>
    <text x="1203" y="938">Results</text><text x="1361" y="938">Offer</text>
  </g>
  <g font-size="19" fill="#64748B" text-anchor="middle">
    <text x="150" y="988">0</text><text x="250" y="988">7</text><text x="379" y="988">16</text><text x="551" y="988">28</text>
    <text x="1124" y="988">68</text><text x="1282" y="988">79</text><text x="1430" y="988">90</text>
  </g>
  <text x="150" y="1030" font-size="22" fill="#475569">Music goes quiet while the call plays ("ducking"). Scene times live in src/config.ts.</text>

  <!-- 4. commands -->
  <text x="150" y="1095" class="h" font-size="34" fill="#B45309">4. Commands (inside marketing/explainer-video)</text>
  <rect x="150" y="1115" width="1290" height="300" rx="14" fill="#1E293B" filter="url(#rough)"/>
  <g class="code" font-size="22" fill="#E2E8F0">
    <text x="180" y="1160">npm run studio     <tspan fill="#94A3B8"># preview in the browser, scrub, play with sound</tspan></text>
    <text x="180" y="1204">npm run draft      <tspan fill="#94A3B8"># quick small video to check timing</tspan></text>
    <text x="180" y="1248">npm run render     <tspan fill="#94A3B8"># final 1080p video + thumbnail (about 2 min)</tspan></text>
    <text x="180" y="1292">npm run audio      <tspan fill="#94A3B8"># rebuild call audio + captions from raw/mix.wav</tspan></text>
    <text x="180" y="1346" fill="#FDE68A">./scripts/render.sh kesar '{"brand":"Kesar &amp; Co.","product":"Saffron Noir"}'</text>
    <text x="180" y="1390" fill="#94A3B8"># one prospect's own version -&gt; out/kesar-explainer-1080p.mp4</text>
  </g>

  <!-- 5. change -->
  <text x="150" y="1480" class="h" font-size="34" fill="#B45309">5. Want to change something?</text>
  <g font-size="23">
    <text x="170" y="1524">&#8226; A word on screen: edit the scene file in <tspan class="code" font-size="21">src/scenes/</tspan>, then npm run render.</text>
    <text x="170" y="1568">&#8226; Your contact / business name: <tspan class="code" font-size="21">contactLine</tspan>, <tspan class="code" font-size="21">company</tspan> in <tspan class="code" font-size="21">src/config.ts</tspan>.</text>
    <text x="170" y="1612">&#8226; A better call: put its recording in <tspan class="code" font-size="21">raw/mix.wav</tspan>, edit <tspan class="code" font-size="21">CLIPS</tspan> in build_audio.py.</text>
  </g>

  <!-- 6. words + rules -->
  <text x="150" y="1700" class="h" font-size="34" fill="#B45309">6. Words</text>
  <g font-size="22">
    <text x="170" y="1744"><tspan font-weight="bold">Remotion</tspan> = React that makes videos.  <tspan font-weight="bold">Props</tspan> = settings you pass in (brand, product).</text>
    <text x="170" y="1788"><tspan font-weight="bold">LUFS</tspan> = loudness; -14 is what YouTube and LinkedIn expect.  <tspan font-weight="bold">Frame</tspan> = one picture.</text>
  </g>
  <rect x="150" y="1820" width="1290" height="110" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" filter="url(#rough)"/>
  <text x="175" y="1862" class="h" font-size="26" fill="#B91C1C">Honesty rules kept in the video</text>
  <text x="175" y="1902" font-size="21">No made-up numbers  &#183;  sample rows tagged "sample"  &#183;  no phone numbers or keys  &#183;  no Hindi claim yet</text>
</svg>
