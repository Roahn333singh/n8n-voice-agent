<svg xmlns="http://www.w3.org/2000/svg" fill="#1F2937" width="1500" height="2000" viewBox="0 0 1500 2000">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ruled" width="1500" height="44" patternUnits="userSpaceOnUse">
      <line x1="0" y1="43" x2="1500" y2="43" stroke="#D6E6F5" stroke-width="2"/>
    </pattern>
    <marker id="ar" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,8 L0,16" fill="none" stroke="#1F2937" stroke-width="3"/></marker>
    <marker id="arG" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,8 L0,16" fill="none" stroke="#059669" stroke-width="3"/></marker>
    <style>
      text { font-family: "Noteworthy", "Chalkboard SE", "Comic Sans MS", cursive; }
      .h { font-family: "Marker Felt", "Chalkboard SE", cursive; }
      .code { font-family: Menlo, monospace; white-space: pre; }
    </style>
  </defs>

  <rect width="1500" height="2000" fill="#FFFDF4"/>
  <rect y="150" width="1500" height="1850" fill="url(#ruled)"/>
  <line x1="115" y1="0" x2="115" y2="2000" stroke="#F4A3A3" stroke-width="3"/>

  <text x="150" y="92" class="h" font-size="58" fill="#1E3A8A">Letting someone in (and out)</text>
  <text x="150" y="138" font-size="26" fill="#64748B">teammate, freelancer, or a client's admin   |   page 2 of 2</text>

  <!-- A: never share -->
  <rect x="150" y="180" width="620" height="420" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="3" filter="url(#rough)"/>
  <text x="175" y="228" class="h" font-size="32" fill="#B91C1C">WRONG: give them a copy</text>
  <text x="175" y="265" class="h" font-size="32" fill="#B91C1C">of YOUR private key</text>
  <text x="175" y="315" font-size="23">&#10007; a copy is forever, you can't take it back</text>
  <text x="175" y="355" font-size="23">&#10007; the server sees 2 people as "you"</text>
  <text x="175" y="395" font-size="23">&#10007; to block them you must lock YOURSELF</text>
  <text x="175" y="430" font-size="23">   out too and make a new key</text>
  <text x="175" y="470" font-size="23">&#10007; it may open other servers you use</text>
  <text x="175" y="510" font-size="23">&#10007; if they leak it, it is your name</text>
  <text x="175" y="565" font-size="22" fill="#B91C1C">Like copying your house key for a plumber.</text>

  <rect x="820" y="180" width="620" height="420" rx="16" fill="#ECFDF5" stroke="#059669" stroke-width="3" filter="url(#rough)"/>
  <text x="845" y="228" class="h" font-size="32" fill="#047857">RIGHT: they bring their</text>
  <text x="845" y="265" class="h" font-size="32" fill="#047857">OWN lock (.pub)</text>
  <text x="845" y="315" font-size="23">&#10003; their key never leaves their laptop</text>
  <text x="845" y="355" font-size="23">&#10003; they log in as their own user</text>
  <text x="845" y="395" font-size="23">&#10003; logs show who did what</text>
  <text x="845" y="435" font-size="23">&#10003; remove their lock = only they are out</text>
  <text x="845" y="475" font-size="23">&#10003; your own key keeps working</text>
  <text x="845" y="515" font-size="23">&#10003; sending a .pub by email is safe</text>
  <text x="845" y="565" font-size="22" fill="#047857">Like adding a 2nd lock that takes their key.</text>

  <!-- B: 4 steps -->
  <text x="150" y="680" class="h" font-size="40" fill="#7C3AED">4 steps to add a teammate (example: Priya)</text>
  <line x1="185" y1="720" x2="185" y2="1390" stroke="#94A3B8" stroke-width="4" stroke-dasharray="10 8"/>
  <g filter="url(#rough)" stroke-width="3">
    <circle cx="185" cy="730" r="26" fill="#DBEAFE" stroke="#2563EB"/>
    <circle cx="185" cy="915" r="26" fill="#DBEAFE" stroke="#2563EB"/>
    <circle cx="185" cy="1100" r="26" fill="#DCFCE7" stroke="#16A34A"/>
    <circle cx="185" cy="1300" r="26" fill="#DBEAFE" stroke="#2563EB"/>
  </g>
  <text x="185" y="740" text-anchor="middle" class="h" font-size="28">1</text>
  <text x="185" y="925" text-anchor="middle" class="h" font-size="28">2</text>
  <text x="185" y="1110" text-anchor="middle" class="h" font-size="28">3</text>
  <text x="185" y="1310" text-anchor="middle" class="h" font-size="28">4</text>

  <text x="240" y="740" class="h" font-size="29"><tspan fill="#1D4ED8">Priya</tspan>, on HER laptop: make her own key pair</text>
  <rect x="240" y="760" width="1200" height="60" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="260" y="800" class="code" font-size="21">ssh-keygen -t ed25519 -C "priya@aurelia" -f ~/.ssh/id_aurelia</text>
  <text x="240" y="860" font-size="22">&#8594; id_aurelia (her KEY, stays with her)  +  id_aurelia.pub (her LOCK, she sends this)</text>

  <text x="240" y="925" class="h" font-size="29"><tspan fill="#1D4ED8">Priya</tspan> sends you ONLY id_aurelia.pub (one line of text)</text>
  <text x="240" y="968" font-size="22">It looks like: <tspan class="code" font-size="20">ssh-ed25519 AAAAC3Nz...long...text priya@aurelia</tspan></text>
  <text x="240" y="1006" font-size="22">Email / WhatsApp is fine. Quick phone check that it really came from her:</text>
  <text x="240" y="1044" class="code" font-size="20">ssh-keygen -lf id_aurelia.pub     # both read the SHA256:... line, same = OK</text>

  <text x="240" y="1110" class="h" font-size="29"><tspan fill="#047857">You</tspan> install her lock on the server</text>
  <text x="240" y="1152" font-size="22">Cloud Console &gt; Compute Engine &gt; VM instances &gt; n8n-vm &gt; Edit</text>
  <text x="240" y="1190" font-size="22">&gt; Security and access &gt; SSH Keys &gt; + Add item &gt; paste her line &gt; Save</text>
  <rect x="240" y="1210" width="1200" height="50" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="260" y="1243" font-size="21" fill="#92400E">Google creates Linux user "priya" (from the end of the line) and gives her sudo = full admin!</text>

  <text x="240" y="1310" class="h" font-size="29"><tspan fill="#1D4ED8">Priya</tspan> logs in with her own key</text>
  <rect x="240" y="1330" width="1200" height="60" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  <text x="260" y="1370" class="code" font-size="21">ssh -i ~/.ssh/id_aurelia priya@YOUR_SERVER_IP</text>

  <!-- C: removing -->
  <rect x="150" y="1440" width="1290" height="165" rx="14" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3" filter="url(#rough)"/>
  <text x="175" y="1485" class="h" font-size="32" fill="#6D28D9">Taking access away (project ended, person left)</text>
  <text x="175" y="1525" font-size="23">Same screen: delete her SSH Keys line &gt; Save. Her key stops working in seconds; yours keeps working.</text>
  <text x="175" y="1568" class="code" font-size="20">sudo deluser --remove-home priya      # optional: also delete her user + files</text>

  <!-- D: client server reverse -->
  <text x="150" y="1680" class="h" font-size="36" fill="#7C3AED">Client server (Path B)? Same idea, roles swapped</text>
  <g filter="url(#rough)" stroke-width="3">
    <rect x="150" y="1705" width="330" height="110" rx="12" fill="#EFF6FF" stroke="#2563EB"/>
    <rect x="740" y="1705" width="330" height="110" rx="12" fill="#ECFDF5" stroke="#059669"/>
  </g>
  <text x="315" y="1752" text-anchor="middle" class="h" font-size="27">YOUR laptop</text>
  <text x="315" y="1790" text-anchor="middle" font-size="20" fill="#64748B">key stays here</text>
  <text x="905" y="1752" text-anchor="middle" class="h" font-size="27">CLIENT's server</text>
  <text x="905" y="1790" text-anchor="middle" font-size="20" fill="#64748B">their admin adds it</text>
  <line x1="485" y1="1760" x2="733" y2="1760" stroke="#059669" stroke-width="4" marker-end="url(#arG)"/>
  <text x="610" y="1745" text-anchor="middle" font-size="21" fill="#047857">your .pub only</text>
  <text x="1100" y="1745" font-size="22">Now YOU are "Priya".</text>
  <text x="1100" y="1783" font-size="22">Contract ends? They</text>
  <text x="1100" y="1821" font-size="22">delete your line.</text>
  <text x="150" y="1870" font-size="23">Never ask a client to send you THEIR private key, and never accept one. Ask for access for YOUR .pub.</text>

  <text x="1440" y="1960" text-anchor="end" class="h" font-size="32" fill="#1E3A8A">details + commands: ssh-keys/README.md</text>
</svg>
